<header class="header">
  <nav class="navigation" aria-label="Main navigation">
    <ul class="menu">
      <li class="menu__entry">
        <a href="{{ '/' | prepend: site.baseurl }}"{% if is_home %} aria-current="page"{% endif %}>About</a>
      </li>
      <li class="menu__entry">
        <a href="{{ '/pub' | prepend: site.baseurl }}"{% if page.url == '/pub' or page.url == '/pub.html' or page.url == '/pub/' %} aria-current="page"{% endif %}>Publications</a>
      </li>
    </ul>
  </nav>
  {% unless is_home %}
  {% if page.publication_page %}
  <h1 class="site-title site-title--publications">{{ page.title }}</h1>
  {% else %}
  <h1 class="site-title"><a href="{{ '/' | prepend: site.baseurl }}" class="logo">{{ site.title }}</a></h1>
  {% endif %}
  {% endunless %}
  {% if site.google_analytics and jekyll.environment == 'production' %}
  {% include google-analytics.html %}
  {% endif %}
</header>
